version: '3.8'
services:
  app:
    build: .
    container_name: ticketing-app
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=testing
      - DB_HOST=db
      - DB_DATABASE=ticketing
      - DB_USERNAME=homestead
      - DB_PASSWORD=secret

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: homestead
    ports:
      - "3306:3306"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
