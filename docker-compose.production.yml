version: '3.8'
services:
  app:
    image: your-registry/ticketing-app:latest
    restart: always
    environment:
      - APP_ENV=production
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ticketing_prod
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
